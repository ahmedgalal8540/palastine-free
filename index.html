<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://thumb.wikimedia.org" crossorigin />
    <link rel="dns-prefetch" href="https://thumb.wikimedia.org" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='8' height='24' fill='%23000'/%3E%3Crect x='8' width='16' height='12' fill='%23fff'/%3E%3Crect x='8' y='12' width='16' height='12' fill='%23007A3D'/%3E%3Cpolygon points='24,12 17,9 17,15' fill='%23CE1126'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d5c3f" />
    <meta
      name="description"
      content="Palestine Guide — a bilingual (Arabic/English) reference about Palestine: land, geography, history, culture and people. دليل فلسطين — مرجع ثنائي اللغة عن الأرض والجغرافيا والتاريخ والثقافة."
    />
    <title>Palestine Guide · دليل فلسطين</title>
    <script>
      // Apply saved theme & language before first paint to avoid flashes.
      ;(function () {
        try {
          var t = localStorage.getItem('pg.theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
          var a = localStorage.getItem('pg.accent') || 'olive'
          document.documentElement.setAttribute('data-accent', a)
          var l = localStorage.getItem('pg.lang') || 'ar'
          document.documentElement.setAttribute('lang', l)
          document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
